<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>港区グルメマップ — 赤坂発・徒歩圏ガイド</title>
<style>
  :root {
    --bg: #0d0f13;
    --bg-elevated: #14171d;
    --bg-card: #171a21;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --fg: #eef0f3;
    --fg-secondary: #a7adb8;
    --fg-muted: #6b7280;
    --fg-faint: #454b57;
    --accent: #ff8a3d;
    --accent-dim: rgba(255,138,61,0.14);
    --accent-border: rgba(255,138,61,0.35);
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, "SF Pro Display", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(13,15,19,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 0.5px solid var(--border);
    padding: 20px 32px 16px;
  }
  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .title-block h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 4px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .title-block h1 .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent-dim);
  }
  .title-block .sub {
    font-size: 12px;
    color: var(--fg-muted);
    font-family: var(--mono);
  }
  .stat-pills { display: flex; gap: 8px; }
  .stat-pill {
    background: var(--bg-elevated);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    text-align: center;
    min-width: 64px;
  }
  .stat-pill .num {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    display: block;
  }
  .stat-pill .label { font-size: 10px; color: var(--fg-muted); letter-spacing: 0.03em; }

  .controls {
    max-width: 1280px;
    margin: 16px auto 0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-group-label {
    font-size: 11px;
    color: var(--fg-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 4px;
    align-self: center;
    font-weight: 500;
  }
  .chip {
    font-family: var(--sans);
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 0.5px solid var(--border);
    background: var(--bg-elevated);
    color: var(--fg-secondary);
    cursor: pointer;
    transition: all 150ms cubic-bezier(0.25,1,0.5,1);
    white-space: nowrap;
    user-select: none;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--fg); }
  .chip.active {
    background: var(--accent-dim);
    border-color: var(--accent-border);
    color: var(--accent);
    font-weight: 500;
  }
  .search-box { margin-left: auto; position: relative; }
  .search-box input {
    background: var(--bg-elevated);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    font-family: var(--sans);
    font-size: 13px;
    padding: 7px 12px 7px 32px;
    width: 220px;
    outline: none;
    transition: border-color 150ms;
  }
  .search-box input:focus { border-color: var(--accent-border); }
  .search-box input::placeholder { color: var(--fg-faint); }
  .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-faint); }

  .divider-row {
    max-width: 1280px;
    margin: 14px auto 0;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11.5px;
    color: var(--fg-faint);
  }
  .divider-row .line { flex: 1; height: 0.5px; background: var(--border); }

  .chip-clear {
    color: var(--fg-faint);
    font-size: 11.5px;
    padding: 5px 10px;
  }
  .chip-clear:hover { color: var(--fg-secondary); border-color: var(--border-strong); }

  .roulette-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 6px;
    border: 0.5px solid var(--accent-border);
    background: var(--accent-dim);
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
    transition: all 150ms cubic-bezier(0.25,1,0.5,1);
  }
  .roulette-btn:hover { background: rgba(255,138,61,0.22); transform: translateY(-1px); }
  .roulette-btn:active { transform: translateY(0); }
  .roulette-btn:disabled:hover { background: var(--accent-dim); transform: none; }

  /* ---------- Roulette modal ---------- */
  .roulette-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,6,8,0.72);
    backdrop-filter: blur(6px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .roulette-overlay.open { display: flex; }
  .roulette-modal {
    position: relative;
    background: var(--bg-card);
    border: 0.5px solid var(--border-strong);
    border-radius: 14px;
    max-width: 480px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .roulette-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--bg-elevated);
    border: 0.5px solid var(--border);
    color: var(--fg-muted);
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .roulette-close:hover { color: var(--fg); border-color: var(--border-strong); }

  .roulette-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--fg-faint);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .roulette-spinning {
    text-align: center;
    padding: 40px 10px;
    font-size: 15px;
    color: var(--fg-secondary);
  }
  .roulette-spinning .spin-name {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--fg);
    margin-top: 12px;
    min-height: 26px;
  }
  .roulette-empty {
    text-align: center;
    padding: 40px 10px;
    color: var(--fg-faint);
  }
  .roulette-result-name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--fg);
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .roulette-result-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .roulette-result-desc {
    font-size: 13px;
    color: var(--fg-secondary);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .roulette-fact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .roulette-fact {
    background: var(--bg-elevated);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .roulette-fact .k {
    font-size: 10px;
    color: var(--fg-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 3px;
  }
  .roulette-fact .v {
    font-size: 12.5px;
    color: var(--fg);
    font-weight: 500;
  }
  .roulette-links {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  .roulette-link-btn {
    flex: 1;
    text-align: center;
    padding: 9px 10px;
    border-radius: 7px;
    border: 0.5px solid var(--border);
    background: var(--bg-elevated);
    color: var(--fg-secondary);
    font-size: 12.5px;
    text-decoration: none;
    font-weight: 500;
    transition: all 150ms;
  }
  .roulette-link-btn:hover { border-color: var(--border-strong); color: var(--fg); }
  .roulette-reroll {
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    border-radius: 8px;
    border: 0.5px solid var(--accent-border);
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .roulette-reroll:hover { background: rgba(255,138,61,0.22); }

  main { max-width: 1280px; margin: 0 auto; padding: 20px 32px 80px; }

  .result-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg-muted);
    margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }
  .result-count b { color: var(--accent); font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: border-color 150ms cubic-bezier(0.25,1,0.5,1);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card:hover { border-color: var(--border-strong); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg); line-height: 1.35; }
  .card-name a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--fg-faint); }
  .card-name a:hover { border-bottom-color: var(--accent); color: var(--accent); }

  .walk-badge {
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .walk-b0 { background: rgba(76,222,128,0.14); color: #4ade80; }
  .walk-b1 { background: rgba(250,204,21,0.14); color: #facc15; }
  .walk-b2 { background: rgba(251,146,60,0.14); color: #fb923c; }
  .walk-b3 { background: rgba(248,113,113,0.14); color: #f87171; }

  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .meta-tag {
    font-size: 11px;
    color: var(--fg-muted);
    background: var(--bg-elevated);
    border: 0.5px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
  }
  .meta-tag.genre { color: var(--fg-secondary); }
  .dot-sm { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .pin { opacity: 0.6; margin-right: 2px; }

  .card-desc { font-size: 12.5px; color: var(--fg-secondary); line-height: 1.55; flex: 1; }
  .card-desc.empty { color: var(--fg-faint); font-style: italic; }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--fg-muted);
    padding-top: 8px;
    border-top: 0.5px solid var(--border);
    font-variant-numeric: tabular-nums;
    gap: 10px;
  }
  .card-footer .price { color: var(--fg); font-weight: 500; flex-shrink: 0; max-width: 55%; }
  .card-footer .addr { color: var(--fg-faint); font-family: var(--sans); font-size: 11px; text-align: right; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .pill-tag {
    font-size: 10.5px;
    color: var(--fg-faint);
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 1px 8px;
  }
  .pill-tag-room {
    color: #4ade80;
    border-color: rgba(76,222,128,0.3);
  }
  .card-links {
    display: flex;
    gap: 6px;
  }
  .card-link {
    flex: 1;
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 8px;
    border-radius: 6px;
    border: 0.5px solid var(--border);
    background: var(--bg-elevated);
    color: var(--fg-secondary);
    text-decoration: none;
    transition: all 150ms;
  }
  .card-link:hover { border-color: var(--border-strong); color: var(--fg); }

  .no-results { text-align: center; padding: 80px 20px; color: var(--fg-faint); }
  .no-results svg { margin-bottom: 12px; opacity: 0.4; }

  .legend-footer {
    max-width: 1280px;
    margin: 40px auto 0;
    padding-top: 20px;
    border-top: 0.5px solid var(--border);
    display: flex;
    gap: 24px;
    font-size: 11.5px;
    color: var(--fg-faint);
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

  @media (max-width: 720px) {
    header { padding: 16px 16px 12px; }
    main { padding: 16px 16px 60px; }
    .header-top { flex-direction: column; align-items: flex-start; }
    .search-box { margin-left: 0; width: 100%; }
    .search-box input { width: 100%; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="title-block">
      <h1><span class="dot"></span>港区グルメマップ</h1>
      <div class="sub">起点：赤坂6-6-25（赤坂駅・赤坂見附駅周辺）／ 徒歩時間は目安値</div>
    </div>
    <div class="stat-pills">
      <div class="stat-pill"><span class="num" id="stat-total">—</span><span class="label">SPOTS</span></div>
      <div class="stat-pill"><span class="num" id="stat-shown">—</span><span class="label">表示中</span></div>
      <div class="stat-pill"><span class="num" id="stat-genres">—</span><span class="label">ジャンル</span></div>
    </div>
  </div>

  <div class="controls">
    <div class="filter-group" id="genre-filters">
      <span class="filter-group-label">ジャンル（複数選択可）</span>
    </div>
    <button class="chip chip-clear" id="genre-clear" style="display:none;">クリア</button>
  </div>
  <div class="controls">
    <div class="filter-group" id="walk-filters">
      <span class="filter-group-label">徒歩（複数選択可）</span>
    </div>
    <button class="chip chip-clear" id="walk-clear" style="display:none;">クリア</button>
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="店名・住所・タグで検索…">
    </div>
  </div>

  <div class="divider-row">
    <span>PORT-KU FIELD GUIDE</span>
    <span class="line"></span>
    <span id="active-filter-summary">全件表示</span>
    <button class="roulette-btn" id="roulette-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      今日の一軒をランダム抽選
    </button>
  </div>
</header>

<main>
  <div class="result-count"><b id="count-num">—</b> 件のスポットを表示中</div>
  <div class="grid" id="grid"></div>
  <div class="no-results" id="no-results" style="display:none;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <div>条件に合うお店が見つかりませんでした</div>
  </div>

  <div class="roulette-overlay" id="roulette-overlay">
    <div class="roulette-modal">
      <button class="roulette-close" id="roulette-close" aria-label="閉じる">✕</button>
      <div class="roulette-modal-inner" id="roulette-modal-inner"></div>
    </div>
  </div>

  <div class="legend-footer">
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(76,222,128,0.5)"></span>徒歩0-5分</div>
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(250,204,21,0.5)"></span>徒歩6-10分</div>
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(251,146,60,0.5)"></span>徒歩11-20分</div>
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(248,113,113,0.5)"></span>徒歩21分以上</div>
    <div class="legend-item" style="margin-left:auto">港区グルメノート（Inkdrop）より生成</div>
  </div>

<script>
(function () {
  "use strict";

  const RESTAURANTS = JSON.parse(document.getElementById('restaurant-data').textContent);

  const GENRE_COLORS = {
    "寿司": "#60a5fa", "焼肉・焼鳥": "#f87171", "とんかつ": "#fbbf24",
    "ラーメン・麺": "#facc15", "中華": "#fb7185", "フレンチ・洋食": "#c084fc",
    "アジア各国": "#4ade80", "海鮮": "#38bdf8", "定食・和食": "#a3e635",
    "居酒屋・バー": "#fb923c", "カフェ・スイーツ": "#f0abfc", "その他": "#94a3b8"
  };

  function walkBucket(walk) {
    if (walk <= 5) return 0;
    if (walk <= 10) return 1;
    if (walk <= 20) return 2;
    return 3;
  }
  const WALK_LABELS = ["徒歩0-5分", "徒歩6-10分", "徒歩11-20分", "徒歩21分以上"];
  const WALK_CLASS = ["walk-b0", "walk-b1", "walk-b2", "walk-b3"];

  const state = { genres: new Set(), walks: new Set(), query: "" };

  const genreCounts = {};
  RESTAURANTS.forEach(r => { genreCounts[r.genreGroup] = (genreCounts[r.genreGroup] || 0) + 1; });
  const genreGroups = Object.keys(genreCounts).sort((a, b) => genreCounts[b] - genreCounts[a]);

  // ---- DOM builders (no innerHTML with dynamic content; safe DOM APIs only) ----

  function el(tag, opts) {
    const node = document.createElement(tag);
    opts = opts || {};
    if (opts.className) node.className = opts.className;
    if (opts.text != null) node.textContent = opts.text;
    if (opts.attrs) for (const k in opts.attrs) node.setAttribute(k, opts.attrs[k]);
    if (opts.style) Object.assign(node.style, opts.style);
    return node;
  }

  function renderFilters() {
    const genreEl = document.getElementById('genre-filters');
    genreGroups.forEach(g => {
      const chip = el('button', { className: 'chip', text: `${g} (${genreCounts[g]})` });
      chip.addEventListener('click', () => {
        if (state.genres.has(g)) state.genres.delete(g); else state.genres.add(g);
        render();
      });
      chip.dataset.genre = g;
      genreEl.appendChild(chip);
    });
    document.getElementById('genre-clear').addEventListener('click', () => {
      state.genres.clear();
      render();
    });

    const walkEl = document.getElementById('walk-filters');
    WALK_LABELS.forEach((label, i) => {
      const count = RESTAURANTS.filter(r => walkBucket(r.walk) === i).length;
      const shortLabel = label.replace('徒歩', '');
      const chip = el('button', { className: 'chip', text: `${shortLabel} (${count})` });
      chip.addEventListener('click', () => {
        if (state.walks.has(i)) state.walks.delete(i); else state.walks.add(i);
        render();
      });
      chip.dataset.walk = String(i);
      walkEl.appendChild(chip);
    });
    document.getElementById('walk-clear').addEventListener('click', () => {
      state.walks.clear();
      render();
    });
  }

  function matchesFilters(r) {
    if (state.genres.size && !state.genres.has(r.genreGroup)) return false;
    if (state.walks.size && !state.walks.has(walkBucket(r.walk))) return false;
    const q = state.query.trim().toLowerCase();
    if (q) {
      const hay = (r.name + ' ' + r.area + ' ' + (r.addr || '') + ' ' + (r.tags || []).join(' ') + ' ' + r.desc).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function buildCard(r) {
    const wb = walkBucket(r.walk);
    const walkText = r.walkNote ? `${r.walk}分（${r.walkNote}）` : `徒歩${r.walk}分`;

    const card = el('div', { className: 'card' });
    card.dataset.genre = r.genreGroup;
    card.dataset.walk = String(wb);
    card.dataset.search = (r.name + ' ' + r.area + ' ' + (r.addr || '') + ' ' + (r.tags || []).join(' ')).toLowerCase();

    const top = el('div', { className: 'card-top' });
    const nameWrap = el('div', { className: 'card-name' });
    if (r.link) {
      const a = el('a', { text: r.name });
      a.href = r.link;
      a.target = '_blank';
      a.rel = 'noopener';
      nameWrap.appendChild(a);
    } else {
      nameWrap.textContent = r.name;
    }
    const badge = el('div', { className: `walk-badge ${WALK_CLASS[wb]}`, text: walkText });
    top.appendChild(nameWrap);
    top.appendChild(badge);
    card.appendChild(top);

    const meta = el('div', { className: 'card-meta' });
    const genreTag = el('span', { className: 'meta-tag genre' });
    const genreDot = el('span', { className: 'dot-sm' });
    genreDot.style.background = GENRE_COLORS[r.genreGroup] || '#94a3b8';
    genreTag.appendChild(genreDot);
    genreTag.appendChild(document.createTextNode(r.genre));
    const areaTag = el('span', { className: 'meta-tag' });
    areaTag.appendChild(el('span', { className: 'pin', text: '📍' }));
    areaTag.appendChild(document.createTextNode(r.area));
    meta.appendChild(genreTag);
    meta.appendChild(areaTag);
    card.appendChild(meta);

    const desc = el('div', {
      className: r.desc ? 'card-desc' : 'card-desc empty',
      text: r.desc || '詳細メモなし'
    });
    card.appendChild(desc);

    if (r.tags && r.tags.length) {
      const tagsRow = el('div', { className: 'card-tags' });
      r.tags.slice(0, 4).forEach(t => tagsRow.appendChild(el('span', { className: 'pill-tag', text: t })));
      if (r.private_room && /個室あり|あり/.test(r.private_room) && !/なし/.test(r.private_room)) {
        tagsRow.appendChild(el('span', { className: 'pill-tag pill-tag-room', text: '🚪 個室あり' }));
      }
      card.appendChild(tagsRow);
    }

    const footer = el('div', { className: 'card-footer' });
    footer.appendChild(el('span', { className: 'price', text: r.price_actual || r.price || '-' }));
    if (r.addr) footer.appendChild(el('span', { className: 'addr', text: r.addr }));
    card.appendChild(footer);

    if (r.tabelog_url || r.link || r.gmap_url) {
      const linkRow = el('div', { className: 'card-links' });
      const tabelogUrl = r.tabelog_url || r.link;
      if (tabelogUrl) {
        const a = el('a', { className: 'card-link', text: '食べログ' + (r.tabelog_score ? ` ${r.tabelog_score}` : '') });
        a.href = tabelogUrl; a.target = '_blank'; a.rel = 'noopener';
        linkRow.appendChild(a);
      }
      const gmapUrl = r.gmap_url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name + ' 東京都港区 ' + (r.addr || r.area))}`;
      const g = el('a', { className: 'card-link', text: 'Map' + (r.gmap_score ? ` ${r.gmap_score}` : '') });
      g.href = gmapUrl; g.target = '_blank'; g.rel = 'noopener';
      linkRow.appendChild(g);
      card.appendChild(linkRow);
    }

    return card;
  }

  function render() {
    document.querySelectorAll('#genre-filters .chip').forEach(c => {
      c.classList.toggle('active', state.genres.has(c.dataset.genre));
    });
    document.querySelectorAll('#walk-filters .chip').forEach(c => {
      c.classList.toggle('active', state.walks.has(Number(c.dataset.walk)));
    });
    document.getElementById('genre-clear').style.display = state.genres.size ? 'inline-flex' : 'none';
    document.getElementById('walk-clear').style.display = state.walks.size ? 'inline-flex' : 'none';

    const filtered = RESTAURANTS.filter(matchesFilters);

    const grid = document.getElementById('grid');
    grid.replaceChildren(...filtered.map(buildCard));
    document.getElementById('no-results').style.display = filtered.length ? 'none' : 'block';
    document.getElementById('count-num').textContent = String(filtered.length);
    document.getElementById('stat-shown').textContent = String(filtered.length);

    const parts = [];
    if (state.genres.size) parts.push([...state.genres].join('+'));
    if (state.walks.size) parts.push([...state.walks].sort().map(i => WALK_LABELS[i]).join('+'));
    const q = state.query.trim();
    if (q) parts.push(`"${q}"`);
    document.getElementById('active-filter-summary').textContent = parts.length ? parts.join(' × ') : '全件表示';

    updateRouletteButtonState(filtered.length);
  }

  function updateRouletteButtonState(count) {
    const btn = document.getElementById('roulette-btn');
    btn.disabled = count === 0;
    btn.style.opacity = count === 0 ? '0.4' : '1';
    btn.style.cursor = count === 0 ? 'not-allowed' : 'pointer';
  }

  // ---------- Roulette ----------

  function el2(tag, opts) { return el(tag, opts); }

  function buildResultView(r) {
    const wrap = el2('div', {});
    wrap.appendChild(el2('div', { className: 'roulette-eyebrow', text: '本日の一軒はこちら' }));
    wrap.appendChild(el2('div', { className: 'roulette-result-name', text: r.name }));

    const badges = el2('div', { className: 'roulette-result-badges' });
    const wb = walkBucket(r.walk);
    badges.appendChild(el2('span', { className: `walk-badge ${WALK_CLASS[wb]}`, text: r.walkNote ? `${r.walk}分（${r.walkNote}）` : `徒歩${r.walk}分` }));
    const genreTag = el2('span', { className: 'meta-tag genre' });
    const dot = el2('span', { className: 'dot-sm' });
    dot.style.background = GENRE_COLORS[r.genreGroup] || '#94a3b8';
    genreTag.appendChild(dot);
    genreTag.appendChild(document.createTextNode(r.genre));
    badges.appendChild(genreTag);
    const areaTag = el2('span', { className: 'meta-tag' });
    areaTag.appendChild(el2('span', { className: 'pin', text: '📍' }));
    areaTag.appendChild(document.createTextNode(r.area));
    badges.appendChild(areaTag);
    wrap.appendChild(badges);

    wrap.appendChild(el2('div', { className: 'roulette-result-desc', text: r.desc || '詳細メモなし' }));

    const factGrid = el2('div', { className: 'roulette-fact-grid' });
    const facts = [
      ['価格帯', r.price_actual || r.price || '-'],
      ['個室', r.private_room || '不明'],
      ['会食向き', r.quiet_business || '不明'],
      ['住所', r.addr || r.area],
    ];
    facts.forEach(([k, v]) => {
      const f = el2('div', { className: 'roulette-fact' });
      f.appendChild(el2('div', { className: 'k', text: k }));
      f.appendChild(el2('div', { className: 'v', text: v }));
      factGrid.appendChild(f);
    });
    wrap.appendChild(factGrid);

    const links = el2('div', { className: 'roulette-links' });
    if (r.link || r.tabelog_url) {
      const a = el2('a', { className: 'roulette-link-btn', text: '食べログ' });
      a.href = r.tabelog_url || r.link;
      a.target = '_blank'; a.rel = 'noopener';
      links.appendChild(a);
    }
    const gmapUrl = r.gmap_url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name + ' 東京都港区 ' + (r.addr || r.area))}`;
    const gmapA = el2('a', { className: 'roulette-link-btn', text: 'Google Map' });
    gmapA.href = gmapUrl;
    gmapA.target = '_blank'; gmapA.rel = 'noopener';
    links.appendChild(gmapA);
    wrap.appendChild(links);

    const reroll = el2('button', { className: 'roulette-reroll', text: 'もう一軒引く' });
    reroll.addEventListener('click', runRoulette);
    wrap.appendChild(reroll);

    return wrap;
  }

  function runRoulette() {
    const pool = RESTAURANTS.filter(matchesFilters);
    const inner = document.getElementById('roulette-modal-inner');

    if (!pool.length) {
      inner.replaceChildren(el2('div', { className: 'roulette-empty', text: '条件に合うお店がありません。フィルタを変えてお試しください。' }));
      return;
    }

    const spinWrap = el2('div', { className: 'roulette-spinning' });
    spinWrap.appendChild(document.createTextNode('抽選中…'));
    const nameEl = el2('div', { className: 'spin-name', text: '' });
    spinWrap.appendChild(nameEl);
    inner.replaceChildren(spinWrap);

    let ticks = 0;
    const maxTicks = 14;
    const timer = setInterval(() => {
      const pick = pool[Math.floor(Math.random() * pool.length)];
      nameEl.textContent = pick.name;
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(timer);
        const finalPick = pool[Math.floor(Math.random() * pool.length)];
        inner.replaceChildren(buildResultView(finalPick));
      }
    }, 80);
  }

  function openRoulette() {
    document.getElementById('roulette-overlay').classList.add('open');
    runRoulette();
  }
  function closeRoulette() {
    document.getElementById('roulette-overlay').classList.remove('open');
  }

  document.getElementById('roulette-btn').addEventListener('click', openRoulette);
  document.getElementById('roulette-close').addEventListener('click', closeRoulette);
  document.getElementById('roulette-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'roulette-overlay') closeRoulette();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeRoulette();
  });

  document.getElementById('search-input').addEventListener('input', (e) => {
    state.query = e.target.value;
    render();
  });

  document.getElementById('stat-total').textContent = String(RESTAURANTS.length);
  document.getElementById('stat-genres').textContent = String(genreGroups.length);

  renderFilters();
  render();
})();
</script>

</body>
</html>
